<div class="centered-content">
  <div class="form-card">
    <div class="form-header">
      <h1 class="form-title">Create a new task</h1>
    </div>
    <div class="form-body">
      <div class="form-field">
        <label class="form-label">Task Name</label>
        <input class="form-input" type="text" placeholder="Enter task name..." [(ngModel)]="taskName">
      </div>
      <div class="form-field">
        <label class="form-label">Amount</label>
        <input class="form-input" type="number" placeholder="Enter amount..." [(ngModel)]="taskAmount">
      </div>
    </div>
    <div class="form-footer">
      <button class="btn btn-cancel" (click)="onCancelClicked()">Cancel</button>
      <button class="btn btn-primary" [class.is-loading]="isLoading" [disabled]="isLoading || !taskName?.trim() || taskAmount === null || taskAmount === undefined" (click)="createTask(taskName, taskAmount)">Add Task</button>
    </div>
  </div>
</div>

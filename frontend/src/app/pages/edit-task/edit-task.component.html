<div class="centered-content">
  <div class="form-card">
    <div class="form-header">
      <h1 class="form-title">Edit task</h1>
    </div>
    <div class="form-body">
      <div *ngIf="isLoadingData" class="loading-spinner"></div>
      <div [hidden]="isLoadingData">
        <div class="form-field">
          <label class="form-label">Task Name</label>
          <input #taskTitleInput class="form-input" type="text" placeholder="Enter task name..." [value]="taskTitle || ''">
        </div>
        <div class="form-field">
          <label class="form-label">Amount</label>
          <input #amountTitleInput class="form-input" type="number" placeholder="Enter amount..." [value]="taskAmount || ''">
        </div>
      </div>
    </div>
    <div class="form-footer">
      <button class="btn btn-cancel" (click)="onCancelClicked()">Cancel</button>
      <button class="btn btn-primary" [class.is-loading]="isLoading" [disabled]="isLoading || isLoadingData" (click)="updateTask(taskTitleInput.value, +amountTitleInput.value)">Save</button>
    </div>
  </div>
</div>

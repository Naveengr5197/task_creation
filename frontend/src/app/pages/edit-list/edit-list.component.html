<div class="centered-content">
  <div class="form-card">
    <div class="form-header">
      <h1 class="form-title">Edit list</h1>
    </div>
    <div class="form-body">
      <div *ngIf="isLoadingData" class="loading-spinner"></div>
      <div [hidden]="isLoadingData">
        <div class="form-field">
          <label class="form-label">List Name</label>
          <input #listTitleInput class="form-input" type="text" placeholder="Enter list name..." [value]="listTitle || ''">
        </div>
      </div>
    </div>
    <div class="form-footer">
      <button class="btn btn-cancel" routerLink="/">Cancel</button>
      <button class="btn btn-primary" [class.is-loading]="isLoading" [disabled]="isLoading || isLoadingData" (click)="updateList(listTitleInput.value)">Save</button>
    </div>
  </div>
</div>

<div class="centered-content">
  <div class="form-card">
    <div class="form-header">
      <h1 class="form-title">Create a new list</h1>
    </div>
    <div class="form-body">
      <div class="form-field">
        <label class="form-label">List Name</label>
        <input #listTitleInput class="form-input" type="text" placeholder="Enter list name...">
      </div>
    </div>
    <div class="form-footer">
      <button class="btn btn-cancel" routerLink="/">Cancel</button>
      <button class="btn btn-primary" [class.is-loading]="isLoading" [disabled]="isLoading" (click)="createList(listTitleInput.value)">Create List</button>
    </div>
  </div>
</div>
